name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      # Secrets are not passed to PRs from forks; skip instead of failing.
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip (no Claude token available)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not available (fork PR or secret missing) - skipping review."

      - name: Check out PR
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude review
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The repository is an Unraid plugin
            (appdata backup): PHP/.page UI and backup logic in src/, shell
            scripts, and the .plg installer manifests.

            Focus on:
            - Correctness bugs and regressions in the backup/restore logic
            - Data-loss risks (wrong paths, unquoted shell variables, rm/tar misuse,
              containers not restarted after errors)
            - Security issues (command injection via exec/shell_exec, unescaped
              user input in the web UI, missing CSRF handling)
            - Consistency between appdata.backup.plg and appdata.backup.beta.plg
              where the PR touches them

            Only report findings you are confident about. Use inline comments
            for concrete issues on specific lines, and post one short summary
            comment with `gh pr comment`. Write the review in English.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
